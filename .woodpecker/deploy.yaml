depends_on:
- build
when:
- event:
  - push
  - manual
  branch: master
  evaluate: CI_REPO_OWNER == "maolei1024"
steps:
- name: resolve-image
  image: docker.io/library/python:3.12-alpine
  commands:
  - python3 .ci/image_release.py resolve komga/server build-${CI_PIPELINE_NUMBER}-arm64
  - python3 .ci/image_release.py pin-files
  environment:
    NEXUS_USERNAME:
      from_secret: nexus_username
    NEXUS_PASSWORD:
      from_secret: nexus_password
- name: deploy
  image: bitnami/kubectl:latest
  commands:
  - mkdir -p ~/.kube
  - echo "$${K8S_KUBECONFIG}" > ~/.kube/config
  - chmod 600 ~/.kube/config
  - TARGET_IMAGE="docker.nexus.ixuni.win/komga/server:build-${CI_PIPELINE_NUMBER}-arm64@$$(cat .ci/digests/komga__server)"
  - 'sed "s|image: docker.nexus.ixuni.win/komga/server:[^[:space:]]*|image: $${TARGET_IMAGE}|" k8s/komga-deployment.yaml |
    kubectl apply -f -'
  - kubectl rollout status deployment/komga -n project-komga --timeout=10m
  environment:
    K8S_KUBECONFIG:
      from_secret: k8s_kubeconfig
  when:
  - event: push
- name: notify-success
  image: docker.nexus.ixuni.win/mlntfy/ci:v12@sha256:7a629cffafa1efe242ffada2631177f61f88fd4b3a758a8b71056bc5253a18d5
  pull: true
  when:
  - status:
    - success
  settings:
    url: https://mlntfy.project.k3s.ixuni.win
    topic: mlNtfy
    status: success
    tags: ci,success,deploy,arm64
- name: notify-failure
  image: docker.nexus.ixuni.win/mlntfy/ci:v12@sha256:7a629cffafa1efe242ffada2631177f61f88fd4b3a758a8b71056bc5253a18d5
  pull: true
  when:
  - status:
    - failure
  settings:
    url: https://mlntfy.project.k3s.ixuni.win
    topic: mlNtfy
    status: failure
    priority: high
    tags: ci,failure,deploy,arm64
