apiVersion: apps/v1
kind: Deployment
metadata:
  name: komga
  namespace: project-komga
  labels:
    app: komga
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 1200
  selector:
    matchLabels:
      app: komga
  template:
    metadata:
      labels:
        app: komga
    spec:
      nodeSelector:
        kubernetes.io/hostname: oracle-ash
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: komga
          # Bootstrap image only; CI substitutes the exact <pipeline>-arm64 tag locally.
          image: docker.nexus.ixuni.win/komga:33-arm64
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVER_ADDRESS
              value: 127.0.0.1
            - name: TZ
              value: Asia/Shanghai
          ports:
            - name: http
              containerPort: 25600
              protocol: TCP
          startupProbe:
            httpGet:
              host: 127.0.0.1
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          hostPath:
            path: /opt/1panel/apps/komga/komga/config
            type: Directory
        - name: data
          hostPath:
            path: /mnt/google-driver/komga/appData
            type: Directory
